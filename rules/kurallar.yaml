# Emlak İlan Kiti: kural dosyası
# Bu bir hukuki görüş değildir; bilgilendirme amaçlıdır.
#
# Her kural: id, baslik, kategori, siddet, kosul (ne zaman devreye girer), duzeltme (ne yapılmalı),
# kaynak (belge + madde + URL + belgenin tarihi + okunma tarihi), guven, gerekirse belirsizlik.
#   siddet: DUZELT (kurala aykırı görünüyor, yayınlamadan düzeltin) | UYARI (risk ya da daha sıkı yorum) |
#           UZMANA_SOR (hukuki değerlendirme gerekir) | MANUEL (gözle bakılmalı) | BILGI
#   guven:  yuksek (birincil metin okundu, açık hüküm) | orta (birincil metin + yorum ya da Bakanlık duyurusu,
#           ya da hesaplanmış değer) | dusuk (ikincil kaynak, platform kuralı doğrulanamadı)
# Kontrol mantığı scripts/ilan.py içinde kural id'si ile eşleşir. Kırmızı bayrak sözlüğü en alttadır;
# genişletebilirsiniz (kelime sonunda $ = tam kelime, r: = düzenli ifade).
#
# Kaynaklar çelişirse DAHA SIKI kural kodlandı ve "belirsizlik" alanında belirtildi.

