# Platform ayarları. DİKKAT: Sahibinden, Hepsiemlak ve Emlakjet panel kuralları giriş gerektirdiği için
# doğrulanamadı (guven: dusuk). Değerler bilerek KISA tutuldu: kısa başlık her panelde geçer.
# Panelde farklı bir sınır görürseniz buradan değiştirin.
platformlar:
  sahibinden:
    ad: "Sahibinden"
    baslik_max: 50
    aciklama_max: 4000
    guven: dusuk
    not: "Form alanları (m², oda, kat, ısıtma, aidat, tapu durumu, kimden...) ayrıca doldurulur; açıklama zorunlu bilgileri yine 'kolay okunabilir' şekilde tekrar eder."
  hepsiemlak:
    ad: "Hepsiemlak"
    baslik_max: 60
    aciklama_max: 4000
    guven: dusuk
    not: "Başlıkta ilçe + mahalle + oda + m² kalıbı kullanılır."
  emlakjet:
    ad: "Emlakjet"
    baslik_max: 60
    aciklama_max: 4000
    guven: dusuk
    not: "Başlıkta oda + tür + konum kalıbı kullanılır."

