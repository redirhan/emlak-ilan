    kategori: gorsel
    siddet: UYARI
    kosul: >
      Satın alma kararını önemli ölçüde etkileyen yapay zekâ kullanımı açıkça belirtilir. Boş daireye sanal mobilya,
      gökyüzü değişimi, render bu kapsamda değerlendirilir. Görselin taşınmazı olduğundan farklı göstermesi (olmayan
      havuz, manzara, genişlik) ayrıca yanıltıcıdır ve DÜZELT olur.
    duzeltme: >
      Görselin üzerine ve açıklamaya beyan yazın: "Mobilyalar yapay zekâ ile yerleştirilmiştir, taşınmaz boş
      teslim edilir." Düzenlenmemiş gerçek fotoğrafları da ilana koyun. Yapıyı değiştiren düzenlemeyi kaldırın.
    kaynak:
      - belge: "Reklam Etiketi Kontrolü (Ticari Reklam Yön. m.18(8), RG 33297)"
        madde: "18(8)"
        url: https://github.com/redirhan/reklam-etiketi
        tarih: "2026-10-27"
        okunma: "2026-10-27"
      - belge: "Taşınmaz Ticareti Hakkında Yönetmelik"
        madde: "12(1)"
        url: https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=24645&MevzuatTur=7&MevzuatTertip=5
        tarih: "2026-10-01"
        okunma: "2026-10-27"
    guven: orta
    belirsizlik: >
      "Önemli ölçüde etkileyecek şekilde" tanımlanmamış. Daha sıkı yorum: taşınmazın görünümünü değiştiren her YZ
      kullanımı beyan edilir (renk/ışık düzeltmesi hariç).

