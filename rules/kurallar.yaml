      eksik: 100.000 TL Bakanlığın işletme başına UYGULADIĞI tutar (2024, 2026); 158.460 TL ise 6563 s. Kanunun
      (platformlar) 2024 üst sınırı. Emlak işletmesine uygulanan 6585 m.18(1)(i)'nin 2026 aralığı hesapla
      28.620 - 858.620 TL'dir (Bakanlık 2026 tutarını ilan etmedi; alt sınır Ekim 2026 cezasıyla birebir tutuyor).
      Daha sıkı olan (yüksek) üst sınır gösterilir.

# Sayısal eşikler (kitin tahmini; mevzuatta sayı yok)
esikler:
  fiyat_min_satilik: 100000
  fiyat_min_kiralik: 1000
  buyuk_harf_orani: 0.6

