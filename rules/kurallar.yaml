# İdari para cezası aralıkları (BİLGİ). "hesaplanmis" = nominal tutar × yeniden değerleme oranları;
# Bakanlığın 2026 için ilan ettiği tutar bulunamadı. 2024 ve 2026 alt sınır değerleri yayımlanmış
# Bakanlık rakamlarıyla (158.460 TL; 28.620 TL) birebir tutuyor.
cezalar:
  - kim: "Emlak işletmesi (ilan veren); Yönetmeliğin 12/2 dışındaki hükümleri (zorunlu bilgiler, yanıltıcı ilan, yetkisiz ilan, sosyal medya kuralları)"
    dayanak: "Taşınmaz Ticareti Hakkında Yönetmelik m.22(4) → 6585 s. Kanun m.18(1)(i)"
    nominal: "10.000 TL - 300.000 TL (her bir aykırılık)"
    yil_2026: "28.620 TL - 858.620 TL (her bir aykırılık)"
    hesaplanmis: true
    tekrar: "Aynı takvim yılında tekrar: önceki cezanın iki katı (6585 m.18(5)). Düzeltilmezse ya da yıl içinde tekrarlanırsa yetki belgesi iptal edilebilir, bir yıl yeni belge verilmez (Yön. m.9(1)(ç), 9(5))."
    ornekler: "100.000 TL/işletme (sosyal medyada mevzuata aykırı ilan, Ağustos 2026; fahiş fiyat artışı, 2023-2024); 28.620 TL (peşinatın fiyat gibi gösterilmesi, Ekim 2026 haberi)"
    kaynak: [TTHY, K6585, K5326, VUK585, TB-SOSYAL-2026, TB-BASIN-2024, HABER-28620]
    guven: orta
  - kim: "İlan platformu (Sahibinden, Hepsiemlak, Emlakjet vb.); Yönetmelik m.12(2) (kimlik ve yetki doğrulama dahil)"
    dayanak: "Taşınmaz Ticareti Hakkında Yönetmelik m.22(4) → 6563 s. Kanun m.12(1)(d)"
    nominal: "10.000 TL - 100.000 TL (her bir aykırılık)"
    yil_2026: "28.620 TL - 286.206 TL (her bir aykırılık)"
    hesaplanmis: true
    tekrar: ""
    ornekler: "Bakan 06.09.2024: 'her bir aykırılık için 158 bin 460 liraya kadar' (2024 üst sınırı)"
    kaynak: [TTHY, K6563, K5326, TB-BOLAT-2024, VUK585]
    guven: orta

kurallar:
  # ---------------- EİDS ----------------
  - id: EIDS-01
    baslik: "EİDS yetki doğrulaması yapıldı mı?"
    kategori: eids
    siddet: DUZELT
    kosul: >
      İlan platformları ilana konu taşınmazın ilan verene (ya da birinci-ikinci derece kan hısmına veya eşine) ait
      olduğunu ya da ilan verenin taşınmaz sahibince yetkilendirildiğini ilanı yayımlamadan önce doğrular. Emlak
      işletmesi için bu, taşınmaz sahibinin e-Devlet'teki "EİDS Taşınmaz İlanı Yayınlama İzni" ekranından işletmeyi
      yetkilendirmesi demektir. Girdide eids.yetki_dogrulandi "evet" değilse kontrol durur.
    duzeltme: >
      Taşınmaz sahibinden e-Devlet > "EİDS Taşınmaz İlanı Yayınlama İzni İşlemleri" üzerinden işletmeniz adına ilan
      izni isteyin (taşınmaz numarası, işletme, süre). İzni TTBS > "Yetki Belgelerim / EİDS İlan Yayınlama İzinlerim"
      ekranında görün. İzin gelmeden ilanı hiçbir kanalda (portal, Instagram, WhatsApp) yayınlamayın.
    kaynak:
      - belge: "Taşınmaz Ticareti Hakkında Yönetmelik"
        madde: "12(2)(c), 12(2)(ç)"
        url: https://www.resmigazete.gov.tr/eskiler/2023/08/20230831-6.htm
        tarih: "2023-08-31"
        okunma: "2026-10-27"
      - belge: "Ticaret Bakanlığı EİDS duyurusu"
        madde: "Kurumsal ilanların verilmesi"
        url: https://ticaret.gov.tr/kurumsal-haberler/elektronik-ilan-dogrulama-sistemi-eids-yetki-dogrulama-uygulamasi-hayata-gecirildi
        tarih: "2024-09-17"
        okunma: "2026-10-27"
      - belge: "Ticaret Bakanlığı sosyal medya duyurusu"
        madde: "tüm taşınmaz ilanları"
        url: https://ticaret.gov.tr/haberler/ticaret-bakanligi-tasinmaz-ve-tasit-ticaretinde-uygulanmakta-olan-elektronik-ilan-dogrulama-sistemi-eids-kapsaminda-kimlik-ve-yetki-dogrulamasi-zorunlulugunu-instagram-facebook-ve-whatsapp-da-dahil-olmak-uzere-elektronik-ortamda-verilen-tum-tasinmaz-ve-tasi
        tarih: "2026-08-22"
        okunma: "2026-10-27"
    guven: yuksek
    belirsizlik: >
      Yetki doğrulamasının satılık konut için başlangıç tarihi kaynaklarda çelişkili: 01.02.2026 ülke geneli (Karar,
      28.12.2025) ya da 01.02.2026 üç pilot il + 15.02.2026 ülke geneli (AA/TRT, 31.01.2026). Satılık arsa/tarla için
      ayrı bir tarih bulunamadı; Ağustos 2026'daki bir sektör açıklaması satılık tarafın henüz tamamlanmadığını
      ima ediyor. Yönetmelik 12(2) metni "satışına yönelik ilanlar" diyor ama Bakanlık kiralığa da uyguluyor.
      DAHA SIKI KURAL KODLANDI: bugün itibarıyla her ilan türü (satılık, kiralık, konut, iş yeri, arsa) ve her kanal
      için EİDS yetki doğrulaması şart sayılır (Bakanlık 22.08.2026: "elektronik ortamda verilen tüm taşınmaz ilanları").

  - id: EIDS-02
    baslik: "Sosyal medya paylaşımında EİDS doğrulamalı ilan linki var mı?"
    kategori: eids
    siddet: DUZELT
    kosul: >
      Instagram, Facebook, WhatsApp, TikTok gibi sosyal medyada yayımlanan taşınmaz ilanlarında EİDS doğrulaması
      yapılmış ilanın linki paylaşılmalıdır. Girdide eids.ilan_linki boşsa reel/carousel çıktıları "yayınlanamaz" işaretlenir.
    duzeltme: >
      Önce ilanı EİDS doğrulamasıyla bir ilan platformunda yayınlayın, ilan linkini (ve ilan numarasını) girdiye yazın.
      Reels/carousel açıklamasının ilk satırlarına ve son karta linki koyun; Instagram açıklamada link tıklanmadığı için
      "İlan linki profilde / açıklamada" yazıp linki profil bağlantısına ya da hikâye bağlantısına da ekleyin.
    kaynak:
      - belge: "Ticaret Bakanlığı sosyal medya duyurusu"
        madde: "sosyal medyada yayımlanan ilanlarda EİDS doğrulaması yapılmış ilan linkinin paylaşılması zorunlu"
        url: https://ticaret.gov.tr/haberler/ticaret-bakanligi-tasinmaz-ve-tasit-ticaretinde-uygulanmakta-olan-elektronik-ilan-dogrulama-sistemi-eids-kapsaminda-kimlik-ve-yetki-dogrulamasi-zorunlulugunu-instagram-facebook-ve-whatsapp-da-dahil-olmak-uzere-elektronik-ortamda-verilen-tum-tasinmaz-ve-tasi
        tarih: "2026-08-22"
        okunma: "2026-10-27"
    guven: yuksek
    belirsizlik: >
      Duyuru linkin "paylaşılmasını" istiyor, yerini (açıklama mı, görsel mi) belirtmiyor. Daha sıkı yorum: link
      açıklamada, fiyat hem açıklamada hem görselde (son kart + kalıcı rozet).

  - id: EIDS-03
    baslik: "Sosyal medya paylaşımında ilan fiyatı var mı?"
    kategori: eids
    siddet: DUZELT
    kosul: >
      Sosyal medyadaki taşınmaz paylaşımlarında EİDS linkinin yanında ilan fiyatı da mutlaka yer almalıdır.
      "Fiyat için DM", "fiyat sorunuz", "fiyat bilgisi için arayın" bu şartı karşılamaz.
    duzeltme: >
      Fiyatı (toplam satış bedeli ya da aylık kira, TL) açıklamaya ve görsele yazın. Bu kit fiyatı reelde kalıcı
      rozet + son kart, carousel'de kapak + bilgi slaytı, açıklamada ilk satırlar olarak ekler.
    kaynak:
      - belge: "Ticaret Bakanlığı sosyal medya duyurusu"
        madde: "EİDS doğrulaması yapılmış ilan linkinin yanı sıra ilan fiyatı bilgisine de mutlaka yer vermeleri gerekmektedir"
        url: https://ticaret.gov.tr/haberler/ticaret-bakanligi-tasinmaz-ve-tasit-ticaretinde-uygulanmakta-olan-elektronik-ilan-dogrulama-sistemi-eids-kapsaminda-kimlik-ve-yetki-dogrulamasi-zorunlulugunu-instagram-facebook-ve-whatsapp-da-dahil-olmak-uzere-elektronik-ortamda-verilen-tum-tasinmaz-ve-tasi
        tarih: "2026-08-22"
        okunma: "2026-10-27"
    guven: yuksek

  - id: EIDS-04
    baslik: "Görseller ve açıklama doğrulanmış ilandaki taşınmaza mı ait?"
    kategori: eids
    siddet: DUZELT
    kosul: >
      Sosyal medyada fotoğraf, video ve açıklama ancak EİDS üzerinden doğrulanmış ilana konu taşınmaza aitse
      kullanılabilir. Başka bir daireden, örnek daireden ya da stok görselden alınmış görüntü bu şartı karşılamaz.
    duzeltme: >
      Yalnız bu taşınmazda çekilmiş görüntüleri kullanın. Aynı projede başka bir bağımsız bölümün (örnek daire)
      görüntüsünü kullanacaksanız ayrı ilan ve ayrı EİDS izni gerekir; aksi halde çıkarın.
    kaynak:
      - belge: "Ticaret Bakanlığı sosyal medya duyurusu"
        madde: "görseller ile açıklamaların EİDS üzerinden doğrulanmış ilana konu taşınmaza ait olması koşuluyla"
        url: https://ticaret.gov.tr/haberler/ticaret-bakanligi-tasinmaz-ve-tasit-ticaretinde-uygulanmakta-olan-elektronik-ilan-dogrulama-sistemi-eids-kapsaminda-kimlik-ve-yetki-dogrulamasi-zorunlulugunu-instagram-facebook-ve-whatsapp-da-dahil-olmak-uzere-elektronik-ortamda-verilen-tum-tasinmaz-ve-tasi
        tarih: "2026-08-22"
        okunma: "2026-10-27"
      - belge: "Taşınmaz Ticareti Hakkında Yönetmelik"
        madde: "12(1), 14(2)(b)"
        url: https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=24645&MevzuatTur=7&MevzuatTertip=5
        tarih: "2026-10-01"
        okunma: "2026-10-27"
    guven: yuksek

  # ---------------- YETKİ ----------------
  - id: YTK-01
    baslik: "Yetki belgesi numarası ilanda mı?"
    kategori: yetki
    siddet: DUZELT
    kosul: >
      İşletmeler ilanlarında yetki belgesi numarasına kolay okunabilir şekilde yer verir.
    duzeltme: >
      isletme.yetki_belgesi_no alanını doldurun. Kit numarayı portal açıklamasındaki "Zorunlu ilan bilgileri"
      bloğuna, reel son kartına ve carousel bilgi slaytına yazar. Numaranızı TTBS'den kontrol edin.
    kaynak:
      - belge: "Taşınmaz Ticareti Hakkında Yönetmelik"
        madde: "14(2)(i)"
        url: https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=24645&MevzuatTur=7&MevzuatTertip=5
        tarih: "2026-10-01"
        okunma: "2026-10-27"
    guven: yuksek

  - id: YTK-02
    baslik: "Yetki belgesindeki işletme adı / unvanı ilanda mı?"
    kategori: yetki
    siddet: DUZELT
    kosul: >
      İlanda yetki belgesindeki işletme adı veya unvanı yer almalıdır. Marka adı ya da Instagram hesap adı
      belgedeki unvandan farklıysa ikisi birlikte yazılır.
    duzeltme: >
      isletme.unvan alanına yetki belgesinde yazan adı/unvanı birebir yazın; markanız farklıysa isletme.marka alanına.
    kaynak:
      - belge: "Taşınmaz Ticareti Hakkında Yönetmelik"
        madde: "14(2)(i)"
        url: https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=24645&MevzuatTur=7&MevzuatTertip=5
        tarih: "2026-10-01"
        okunma: "2026-10-27"
    guven: yuksek

  - id: YTK-03
    baslik: "Taşınmaz için yazılı yetkilendirme sözleşmesi var mı?"
    kategori: yetki
    siddet: DUZELT
    kosul: >
      İşletme alım satım, pazarlama veya kiralamaya yetkili olmadığı taşınmaza ilan veremez; hizmet yazılı
      yetkilendirme sözleşmesine dayanır. EİDS ilan izni bu sözleşmenin yerine geçmez.
    duzeltme: >
      Taşınmaz sahibiyle yazılı yetkilendirme sözleşmesi yapın (asgari bilgiler Yön. m.15). Sözleşmede olmayan bir
      koşulu (fiyat, kira, takas) ilana yazmayın.
    kaynak:
      - belge: "Taşınmaz Ticareti Hakkında Yönetmelik"
        madde: "14(2)(j), 14(2)(ı), 15(1)"
        url: https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=24645&MevzuatTur=7&MevzuatTertip=5
        tarih: "2026-10-01"
        okunma: "2026-10-27"
      - belge: "Ticaret Bakanlığı EİDS duyurusu"
        madde: "EİDS ilan verme yetkisi sözleşme ve diğer belgelerin yerine geçmez"
        url: https://ticaret.gov.tr/kurumsal-haberler/elektronik-ilan-dogrulama-sistemi-eids-yetki-dogrulama-uygulamasi-hayata-gecirildi
        tarih: "2024-09-17"
        okunma: "2026-10-27"
    guven: yuksek

  - id: YTK-04
    baslik: "Yetki süresi yayın tarihinde geçerli mi?"
    kategori: yetki
    siddet: DUZELT
    kosul: >
      Taşınmaz satılır ya da kiralanırsa, sahibi vazgeçerse, yetkilendirme sözleşmesi feshedilir ya da süresi
      biterse ilan faaliyetine üç gün içinde son verilir. Girdideki yetki bitiş tarihi yayın tarihinden önceyse ya da
      yayın süresi içinde bitiyorsa bayrak kalkar.
    duzeltme: >
      Yetkiyi (sözleşme + EİDS izni) uzatın ya da ilanı kaldırın. Satış/kiralama olunca portal ilanını ve sosyal
      medya paylaşımlarını üç gün içinde kaldırın ya da "satıldı" diye güncelleyip fiyat/link içeren kısmı silin.
    kaynak:
      - belge: "Taşınmaz Ticareti Hakkında Yönetmelik"
        madde: "14(2)(h)"
        url: https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=24645&MevzuatTur=7&MevzuatTertip=5
        tarih: "2026-10-01"
        okunma: "2026-10-27"
    guven: yuksek
    belirsizlik: >
      "Satıldı" paylaşımının (fiyat ve link olmadan) ilan faaliyeti sayılıp sayılmadığı net değil; daha sıkı yorumla
      eski ilan paylaşımı kaldırılır, gerekirse fiyatsız ve linksiz yeni bir "satıldı" gönderisi yapılır.

  # ---------------- ZORUNLU BİLGİLER (m.14/2-i + m.15/3) ----------------
