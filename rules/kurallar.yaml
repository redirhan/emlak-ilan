        tarih: "2024-09-06"
        okunma: "2026-10-27"
    guven: yuksek

  - id: ZRN-03
    baslik: "İmar ve yapı kullanma izni (iskân) durumu yazılı mı?"
    kategori: zorunlu
    siddet: DUZELT
    kosul: >
      14(2)(i), 15(3)'teki bilgileri ilanda ister; 15(3)(a) imar ve yapı kullanma izin durumudur.
    duzeltme: >
      tapu.iskan (var / yok / proje aşamasında) ve arsa için arsa.imar_durumu alanlarını doldurun. Bilmiyorsanız
      "bilinmiyor" yazıp ilanı yayınlamadan önce belediyeden öğrenin; tahminle "iskânlı" yazmayın.
    kaynak:
      - belge: "Taşınmaz Ticareti Hakkında Yönetmelik"
        madde: "14(2)(i) → 15(3)(a)"
        url: https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=24645&MevzuatTur=7&MevzuatTertip=5
        tarih: "2026-10-01"
        okunma: "2026-10-27"
    guven: orta
    belirsizlik: >
      15(3) asgari bilgileri yetkilendirme SÖZLEŞMESİ için sayıyor; 14(2)(i) ilanlarda "15 inci maddenin üçüncü
      fıkrasında belirtilen diğer bilgilere" yer verilmesini istiyor. Daha sıkı okuma kodlandı: 15(3)'teki her bilgi
      ilanda da istenir. Proje, ticari ve tapusuz taşınmazda 15(4) gereği "uygun olanlar" yeterli sayılabilir.

