    guven: yuksek

  - id: FYT-02
    baslik: "Fiyat toplam bedel mi? (peşinat, taksit ya da 'başlayan fiyat' değil)"
    kategori: fiyat
    siddet: DUZELT
    kosul: >
      İlandaki fiyat toplam satış bedeli (kiralıkta aylık kira) olmalıdır. Peşinatı, ilk taksiti ya da "...'den
      başlayan" fiyatı ilan fiyatı gibi göstermek yanıltıcıdır. Ekim 2026'da toplam bedel yerine peşinatı fiyat
      gibi gösteren bir işletmeye 28.620 TL ceza verildiği haberi var.
    duzeltme: >
      fiyat_turu: toplam yapın ve toplam bedeli yazın. Peşinat/taksit seçeneğini açıklamada ayrıca belirtin:
      "Toplam fiyat 4.500.000 TL; 2.000.000 TL peşin, kalanı 12 ay taksit."
    kaynak:
      - belge: "Taşınmaz Ticareti Hakkında Yönetmelik"
        madde: "12(1), 14(2)(b), 14(2)(ç)"
        url: https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=24645&MevzuatTur=7&MevzuatTertip=5
        tarih: "2026-10-01"
        okunma: "2026-10-27"
      - belge: "Yeni Alanya haberi"
        madde: "toplam satış bedelinin açıkça belirtilmemesi"
        url: https://www.yenialanya.com/emlak-ilaninin-bedeli-agir-oldu-28-bin-tl-ceza-yedi
        tarih: "2026-10-26"
        okunma: "2026-10-27"
    guven: yuksek

  - id: FYT-03
    baslik: "Fiyat Türk lirası mı?"
    kategori: fiyat
    siddet: UYARI
    kosul: >
      Türkiye'de yerleşik kişiler kendi aralarındaki taşınmaz satış ve kira sözleşmelerinde bedeli döviz ya da
      dövize endeksli belirleyemez (istisnalar var). Dövizle fiyat ilanı bu nedenle risklidir.
    duzeltme: >
      Fiyatı TL yazın. Alıcı/kiracı yurt dışında yerleşikse ya da başka bir istisna varsa döviz kullanmadan önce
      uzmana danışın.
    kaynak:
      - belge: "32 Sayılı Karar m.4(g) (Cumhurbaşkanı Kararı 85, RG 30534) + Tebliğ 2008-32/34"
        madde: "4(g)"
        url: https://www.alomaliye.com/2018/09/13/turk-parasi-kiymetini-korumu-sayi-85/amp/
        tarih: "2018-09-13"
        okunma: "2026-10-27"
    guven: orta
    belirsizlik: >
      Yasak sözleşme bedeline ilişkindir; ilan metnine doğrudan bir hüküm bulunamadı. Birincil metin bu çalışmada
      açılamadı (ikincil kaynak). İstisnalar 2024-32/69 sayılı tebliğle genişletildi; kapsamı doğrulanmadı.

  - id: FYT-04
    baslik: "Fiyat gerçekçi mi? (yem fiyat)"
    kategori: fiyat
    siddet: DUZELT
    kosul: >
      "1 TL", "1.000 TL'ye satılık daire" gibi gerçek olmayan fiyatla ilgi toplamak yanıltıcı ilandır. Kontrol, satılıkta
      fiyat_min_satilik, kiralıkta fiyat_min_kiralik altındaki fiyatları bayraklar.
    duzeltme: "Gerçek ve sözleşmedeki fiyatı yazın."
    kaynak:
      - belge: "Taşınmaz Ticareti Hakkında Yönetmelik"
        madde: "12(1), 14(2)(b), 14(2)(ı)"
        url: https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=24645&MevzuatTur=7&MevzuatTertip=5
        tarih: "2026-10-01"
        okunma: "2026-10-27"
    guven: orta
    belirsizlik: "Eşik değerler bu kitin tahminidir (aşağıdaki esikler bölümü), mevzuatta sayı yoktur."

  - id: FYT-05
    baslik: "KDV durumu açık mı? (yeni konut / iş yeri / müteahhit satışı)"
    kategori: fiyat
    siddet: UYARI
    kosul: >
      Müteahhitten ya da KDV mükellefi satıcıdan satışta KDV'nin dahil olup olmadığı fiyatı etkiler; belirtilmezse
      tercihleri etkileyen bilgi gizlenmiş sayılabilir.
    duzeltme: "kdv alanını 'dahil', 'haric' ya da 'yok' yapın; kit açıklamaya yazar."
    kaynak:
      - belge: "Taşınmaz Ticareti Hakkında Yönetmelik"
        madde: "14(2)(ç)"
        url: https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=24645&MevzuatTur=7&MevzuatTertip=5
        tarih: "2026-10-01"
        okunma: "2026-10-27"
    guven: dusuk
    belirsizlik: "KDV gösterimi için emlak ilanına özgü bir hüküm bulunamadı; bu bir iyi uygulama kontrolüdür."

  - id: FYT-06
    baslik: "İlan fiyatı yükseltildi mi? (haklı sebep)"
    kategori: fiyat
    siddet: UYARI
    kosul: >
      İnternet ilanlarında genel ekonomik verilerle uyumlu olmayan ve haklı bir sebebe dayanmayan fiyat artışı
      yapılamaz; işletmeler bu ilanlara aracılık edemez (RG 30.05.2025 / 32915 ile eklendi). Girdide önceki fiyat
      mevcut fiyattan düşükse bayrak kalkar.
    duzeltme: >
      Artışın sebebini (tadilat, yeni ekspertiz, sözleşmedeki yeni fiyat) yazılı tutun. Artış oranı yüksekse ya da
      ilan kısa sürede birden çok kez yükseltildiyse yayınlamadan önce uzmana danışın.
    kaynak:
      - belge: "Taşınmaz Ticareti Hakkında Yönetmelik"
        madde: "12(3)"
        url: https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=24645&MevzuatTur=7&MevzuatTertip=5
        tarih: "2026-10-01"
        okunma: "2026-10-27"
      - belge: "Ticaret Bakanlığı basın açıklaması"
        madde: "fahiş fiyat artışı cezaları"
        url: https://ticaret.gov.tr/haberler/emlak-sektorune-yonelik-faaliyetler-ve-uygulanan-idari-para-cezalarina-iliskin-basin-aciklamasi
        tarih: "2024-06-28"
        okunma: "2026-10-27"
    guven: orta
    belirsizlik: "Mevzuatta sayısal bir artış eşiği yok; 'genel ekonomik veriler' tanımlanmamış."

  - id: FYT-07
    baslik: "'Fiyat düştü' / indirim iddiası belgeli mi?"
    kategori: fiyat
    siddet: UYARI
    kosul: >
      Metinde indirim ya da fiyat düşüşü vurgusu varsa (üstü çizili fiyat, "%10 indirim", "fiyat düştü") Ticari
      Reklam Yönetmeliği m.14 kontrolü gerekir: önceki fiyat = indirimden önceki 10 günün en düşük fiyatı, aynı kanal.
      Kit reklam_kontrol.yaml yazar ve Reklam Etiketi Kontrolü skill'i kuruluysa çalıştırır.
    duzeltme: >
      fiyat_gecmisi.onceki_fiyat, son_10_gun_en_dusuk, degisim_tarihi ve kanal alanlarını doldurun. Belgeleyemiyorsanız
      indirim dilini kaldırın, yalnız güncel fiyatı yazın.
    kaynak:
      - belge: "Reklam Etiketi Kontrolü (Ticari Reklam ve Haksız Ticari Uygulamalar Yön. m.14, RG 33297)"
        madde: "14(1)-(3)"
        url: https://github.com/redirhan/reklam-etiketi
        tarih: "2026-10-27"
        okunma: "2026-10-27"
    guven: orta
    belirsizlik: >
      m.14'ün emlak işletmesinin (satıcı değil, aracı) ilanındaki fiyat düşüşüne uygulanıp uygulanmadığı net değil.
      6502'de konut "mal" tanımına girer. Daha sıkı yorumla uygulanır.

